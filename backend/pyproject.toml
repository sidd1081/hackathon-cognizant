[project]
name = "incident-rca-backend"
version = "0.1.0"
description = "AI-Powered Incident Root Cause Analysis & Resolution Assistant - Backend"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pandas>=2.2",
    "sentence-transformers>=6.0.0",
    "faiss-cpu>=1.15.0",
    "langchain>=1.3.15",
    "langchain-groq>=1.1.3",
    "python-multipart>=0.0.32",
    "pyjwt>=2.9",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "rank-bm25>=0.2.2",
]

# This is an application, not a distributable library, so uv should install the
# dependencies without trying to build/install the project itself as a package.
[tool.uv]
package = false
